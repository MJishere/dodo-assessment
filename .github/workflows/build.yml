name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        shell: powershell
        run: |
          gitleaks git . --verbose --exit-code 1

      - name: Run Semgrep
        run: |
          semgrep scan --config p/ci .

      - name: Run Trivy Filesystem Scan
        shell: powershell
        run: |
          trivy fs . --severity HIGH,CRITICAL
          

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/ledger-api:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          docker build -t "$IMAGE" ./task2/app

      - name: Run Trivy Image Scan
        shell: powershell
        run: |
          trivy image ${{ env.IMAGE }} --severity HIGH,CRITICAL
      
      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE }}

      - name: Sign Container Image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE }}
          